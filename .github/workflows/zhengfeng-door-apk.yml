name: Build Zhengfeng Door APK
on:
  push:
    branches:
      - 'build/zhengfeng-door-apk-20261103'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir -p zhengfeng-build
          base64 -d .ci/zhengfeng-src.tar.gz.b64 | tar -xz -C zhengfeng-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: zhengfeng-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZhengfengDoor-debug-APK
          path: zhengfeng-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
