name: Build Zhengfeng Door Widget v2 APK
on:
  push:
    branches:
      - 'build/zhengfeng-door-widget-v2-20261104'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack v2 source
        run: |
          mkdir -p zf-v2
          base64 -d .ci/zhengfeng-v2-source.tar.gz.b64 | tar -xz -C zf-v2
          test -f zf-v2/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: zf-v2
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK details
        run: |
          ls -lh zf-v2/app/build/outputs/apk/debug/app-debug.apk
          sha256sum zf-v2/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZhengfengDoorWidget-v2-APK
          path: zf-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
